name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies (incl. dev group)
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests
        # Suite is fully mocked — no Postgres, no network, no API keys needed.
        run: uv run pytest -q

  docker-build:
    # Verify the runtime image builds (no push) so the Dockerfile can't rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clinical-trials-mcp:ci .

  clean-clone:
    # Gate 1 of the portfolio rubric, as a check rather than a claim: a fresh
    # checkout with no API keys must come up queryable from `docker compose up`
    # alone, seeded by the bundled demo corpus, and pass the server's selftest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Start Postgres (auto-loads schema + demo corpus)
        run: docker compose up -d

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T db pg_isready -U ctmcp -d clinical_trials; then exit 0; fi
            sleep 2
          done
          echo "database never became ready"; docker compose logs db; exit 1

      - name: Selftest every server
        # No .env, so this also proves the keyless path: tools register, the
        # corpus is present, and nothing requires a credential to start.
        run: |
          for source in clinical openfda_label openfda_event openfda_enforcement openfda_drugsfda pubmed; do
            echo "--- $source"
            MCP_SUITE_SOURCE=$source uv run python -m core.server --selftest
          done

      - name: Search the demo corpus without any API key
        run: |
          uv run python - <<'PY'
          import asyncio
          from core.config import settings
          from core.store.connection import init_pool, close_pool
          from core.tools.semantic_search import semantic_search

          async def main():
              pool = await init_pool(settings.database_url)
              out = (await semantic_search(pool, "clinical", "immunotherapy for liver cancer", 3))[0].text
              print(out)
              assert "NCT" in out, "demo corpus returned no trials"
              assert "no VOYAGE_API_KEY set" in out, "expected the lexical-only notice"
              await close_pool()

          asyncio.run(main())
          PY

      - name: Tear down
        if: always()
        run: docker compose down -v

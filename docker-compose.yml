services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clinical_trials_db
    environment:
      POSTGRES_USER: ctmcp
      POSTGRES_PASSWORD: ctmcp_password
      POSTGRES_DB: clinical_trials
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctmcp -d clinical_trials"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:

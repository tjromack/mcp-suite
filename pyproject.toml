[project]
name = "clinical-trial-mcp"
version = "0.1.0"
description = "MCP server that wraps ClinicalTrials.gov with pgvector-powered semantic search"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tjromack", email = "tjromack@gmail.com" }]
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "anthropic>=0.39.0",
    "voyageai>=0.3.0",
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.4.0",
    "truststore>=0.9.0",
]

# PEP 735 dependency group — uv installs this by default on `uv sync`,
# unlike [project.optional-dependencies] which needs an explicit --extra.
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_trial_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "clinical-trial-mcp"
version = "0.1.0"
description = "mcp-suite — a shared core + per-vertical MCP servers over curated life-sciences data (clinical server in v0.1; openFDA, PubMed planned). Distribution name kept as 'clinical-trial-mcp' through Phase A to preserve existing claude_desktop_config.json entries; will rename once a publishable package story exists."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tjromack", email = "tjromack@gmail.com" }]
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "anthropic>=0.39.0",
    "voyageai>=0.3.0",
    "curl-cffi>=0.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.4.0",
    "truststore>=0.9.0",
]

# Per-server extras: enable selective installs once verticals add deps
# beyond what core needs (e.g. `pip install clinical-trial-mcp[openfda]`).
# Empty during Phase A — declared so the structure is visible early.
[project.optional-dependencies]
clinical = []
openfda = []

# PEP 735 dependency group — uv installs this by default on `uv sync`,
# unlike [project.optional-dependencies] which needs an explicit --extra.
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_trial_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/clinical_trial_mcp"]
# Third-party libs (mcp, voyageai, curl_cffi, asyncpg, anthropic) ship no
# stubs — don't fail the gate on their missing types.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
